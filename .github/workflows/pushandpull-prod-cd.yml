name: pushandpull prod CD

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Version
        id: version
        run: |
          DATE=$(date -u +"%Y%m%d")
          EXISTING=$(git tag -l "v${DATE}.*" | wc -l | tr -d ' ')
          VERSION="v${DATE}.${EXISTING}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Create Tag
        run: git tag ${{ steps.version.outputs.version }}

      - name: Push Tag
        run: git push origin ${{ steps.version.outputs.version }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            --title "${{ steps.version.outputs.version }}" \
            --notes $'## 수정내역\n\n- '

  deploy:
    runs-on: ubuntu-latest
    needs: release

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker Image
        run: |
          docker build \
            -t seanyee1227/pushandpull-server:latest \
            -f PushAndPull/deploy/prod.dockerfile \
            PushAndPull

      - name: Push Docker Image
        run: docker push seanyee1227/pushandpull-server:latest

      - name: Copy Compose File to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "PushAndPull/deploy/compose.prod.yaml"
          target: "~/deploy/"
          strip_components: 2

      - name: Deploy via Docker Compose
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p ~/deploy

            printf 'DB_CONNECTION_STRING=%s\nREDIS_CONNECTION_STRING=%s\nSTEAM_WEB_API_KEY=%s\nSTEAM_APP_ID=%s\n' \
              "${{ secrets.DB_CONNECTION_STRING }}" \
              "${{ secrets.REDIS_CONNECTION_STRING }}" \
              "${{ secrets.STEAM_WEB_API_KEY }}" \
              "${{ secrets.STEAM_APP_ID }}" \
              > ~/deploy/.env

            docker compose -f ~/deploy/compose.prod.yaml --env-file ~/deploy/.env pull
            docker compose -f ~/deploy/compose.prod.yaml --env-file ~/deploy/.env up -d

            sleep 5
            docker ps | grep pushandpull-server
            docker logs pushandpull-server --tail 20

  notify:
    runs-on: ubuntu-latest
    needs: [release, deploy]
    if: always()

    steps:
      - name: Send Discord Notification
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ needs.deploy.result }}
          title: "PushAndPull Prod CD"
          description: |
            Released `${{ needs.release.outputs.version }}` · by **${{ github.actor }}**
            **Release:** ${{ needs.release.result }}
            **Deploy:** ${{ needs.deploy.result }}
