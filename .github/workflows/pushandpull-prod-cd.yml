name: pushandpull prod CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Version
        id: version
        run: |
          DATE=$(date -u +"%Y%m%d")
          EXISTING=$(git tag -l "v${DATE}.*" | wc -l | tr -d ' ')
          VERSION="v${DATE}.${EXISTING}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Create Tag
        run: git tag ${{ steps.version.outputs.version }}

      - name: Push Tag
        run: git push origin ${{ steps.version.outputs.version }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            --title "${{ steps.version.outputs.version }}" \
            --notes $'## 수정내역\n\n- '

  deploy:
    runs-on: ubuntu-latest
    needs: release

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker Image
        run: |
          docker build \
            -t seanyee1227/pushandpull-server:latest \
            -f PushAndPull/deploy/prod.dockerfile \
            PushAndPull

      - name: Push Docker Image
        run: docker push seanyee1227/pushandpull-server:latest

      - name: Copy Compose File to Server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          source: "PushAndPull/deploy/compose.yaml,PushAndPull/deploy/compose.prod.yaml"
          target: "~/deploy/"
          strip_components: 2

      - name: Deploy via Docker Compose
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          script: |
            set -euo pipefail
            mkdir -p ~/deploy

            printf 'DB_CONNECTION_STRING=%s\nSTEAM_WEB_API_KEY=%s\nSTEAM_APP_ID=%s\n' \
              "${{ secrets.DB_CONNECTION_STRING }}" \
              "${{ secrets.STEAM_API_KEY }}" \
              "${{ secrets.STEAM_APP_ID }}" \
              > ~/deploy/.env

            docker compose -f ~/deploy/compose.yaml -f ~/deploy/compose.prod.yaml --env-file ~/deploy/.env pull

            # 외부 DB 인스턴스가 받을 준비가 됐는지 확인 후 기동 (db -> server)
            DB_HOST=$(echo "${{ secrets.DB_CONNECTION_STRING }}" | sed -n 's/.*[Hh]ost=\([^;]*\).*/\1/p')
            DB_PORT=$(echo "${{ secrets.DB_CONNECTION_STRING }}" | sed -n 's/.*[Pp]ort=\([^;]*\).*/\1/p')
            DB_PORT=${DB_PORT:-5432}
            echo "Checking DB reachability at ${DB_HOST}:${DB_PORT}..."
            for i in $(seq 1 30); do
              if nc -z "$DB_HOST" "$DB_PORT" 2>/dev/null; then
                echo "DB is reachable."
                break
              fi
              if [ "$i" = "30" ]; then
                echo "DB unreachable after 30 attempts. Aborting deploy."
                exit 1
              fi
              echo "waiting for DB... ($i/30)"
              sleep 2
            done

            docker compose -f ~/deploy/compose.yaml -f ~/deploy/compose.prod.yaml --env-file ~/deploy/.env up -d

            sleep 5
            docker ps | grep pushandpull-server
            docker logs pushandpull-server --tail 20

  notify:
    runs-on: ubuntu-latest
    needs: [release, deploy]
    if: always()

    steps:
      - name: Send Discord Notification
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ needs.deploy.result }}
          title: "PushAndPull Prod CD"
          description: |
            Released `${{ needs.release.outputs.version }}` · by **${{ github.actor }}**
            **Release:** ${{ needs.release.result }}
            **Deploy:** ${{ needs.deploy.result }}
