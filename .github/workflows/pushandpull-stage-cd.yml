name: pushandpull stage CD

on:
  push:
    branches:
      - develop
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker Image
        run: |
          docker build \
            -t seanyee1227/pushandpull-server:stage \
            -f PushAndPull/deploy/prod.dockerfile \
            PushAndPull

      - name: Push Docker Image
        run: docker push seanyee1227/pushandpull-server:stage

      - name: Copy Compose File to Server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.STAGE_SSH_HOST }}
          username: ${{ secrets.STAGE_SSH_USERNAME }}
          port: ${{ secrets.STAGE_SSH_PORT }}
          key: ${{ secrets.STAGE_SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.STAGE_SSH_FINGERPRINT }}
          source: "PushAndPull/deploy/compose.yaml,PushAndPull/deploy/compose.stage.yaml"
          target: "~/deploy/"
          strip_components: 2

      - name: Deploy via Docker Compose
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.STAGE_SSH_HOST }}
          username: ${{ secrets.STAGE_SSH_USERNAME }}
          port: ${{ secrets.STAGE_SSH_PORT }}
          key: ${{ secrets.STAGE_SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.STAGE_SSH_FINGERPRINT }}
          script: |
            set -euo pipefail
            mkdir -p ~/deploy

            printf 'POSTGRES_DB=%s\nPOSTGRES_USER=%s\nPOSTGRES_PASSWORD=%s\nSTEAM_WEB_API_KEY=%s\nSTEAM_APP_ID=%s\n' \
              "${{ secrets.STAGE_POSTGRES_DB }}" \
              "${{ secrets.STAGE_POSTGRES_USER }}" \
              "${{ secrets.STAGE_POSTGRES_PASSWORD }}" \
              "${{ secrets.STEAM_API_KEY }}" \
              "${{ secrets.STEAM_APP_ID }}" \
              > ~/deploy/.env

            docker volume create pushandpull-stage-postgres-data

            docker compose -f ~/deploy/compose.yaml -f ~/deploy/compose.stage.yaml --env-file ~/deploy/.env pull
            docker compose -f ~/deploy/compose.yaml -f ~/deploy/compose.stage.yaml --env-file ~/deploy/.env up -d

            sleep 5
            docker ps | grep pushandpull-stage-server
            docker logs pushandpull-stage-server --tail 20

  notify:
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()

    steps:
      - name: Get Short SHA
        id: sha
        run: echo "short=$(echo '${{ github.sha }}' | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Send Discord Notification
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ needs.deploy.result }}
          title: "PushAndPull Stage CD"
          description: |
            Deployed `${{ github.ref_name }}` · `${{ steps.sha.outputs.short }}` · by **${{ github.actor }}**
            **Deploy:** ${{ needs.deploy.result }}
